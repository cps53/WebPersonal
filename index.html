<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carles P</title>
    <style>
        /* Estils globals minimalistes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        p {
            font-size: 1.1rem;
            color: #6c757d;
            font-weight: 300;
        }

        /* Una petita línia decorativa de sota */
        .divider {
            width: 50px;
            height: 2px;
            background-color: #0070f3;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Carles P</h1>
        <p></p>
    </div>

</body>
</html>
